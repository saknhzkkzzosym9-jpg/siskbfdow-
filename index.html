<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VB PvZ Turbo</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle, #0f3d0f, #000);
  color: #b6ffb6;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 10px;
}

h2 {
  text-align: center;
  text-shadow: 0 0 10px lime;
}

input {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  border-radius: 10px;
  border: none;
  background: #1a1a1a;
  color: #00ff88;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  margin-top: 6px;
  font-weight: bold;
}

.ok { background: #00c853; }
.green { background: #00c853; }
.red { background: #ff1744; }

.card {
  background: #111;
  border: 2px solid #00ff88;
  border-radius: 15px;
  padding: 10px;
  margin-top: 10px;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.row {
  display: flex;
  gap: 5px;
}

.row button { flex: 1; }

#reader {
  margin-top: 10px;
}

.popup {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
}

.popup-content {
  background: #111;
  border: 2px solid lime;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
}

.hidden { display: none; }
</style>
</head>

<body>

<div class="container">

<h2>🌿 VB PvZ Turbo</h2>

<input id="codeInput" placeholder="Код (або скан)">
<button onclick="startScanner()">📷 Сканувати</button>

<div id="reader"></div>

<input type="file" id="photo">
<input id="name" placeholder="Назва">
<input id="weight" placeholder="Вага">

<button class="ok" onclick="createParcel()">ОК</button>

<input placeholder="Пошук..." oninput="search(this.value)">
<div id="list"></div>

</div>

<div id="popup" class="popup hidden">
<div class="popup-content">
<h2 id="cellText"></h2>
<button onclick="closePopup()">OK</button>
</div>
</div>

<script>
let parcels = [];
let usedCodes = new Set();
let scanner;

function generateCode() {
  let code;
  do {
    code = Math.floor(100 + Math.random() * 900);
  } while (usedCodes.has(code));
  return code;
}

function startScanner() {
  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decodedText) => {
      document.getElementById("codeInput").value = decodedText;
      scanner.stop();
    }
  ).catch(err => {
    alert("Камера не запустилась 😢");
  });
}

function createParcel() {
  let manualCode = document.getElementById('codeInput').value;
  let file = document.getElementById('photo').files[0];
  let name = document.getElementById('name').value;
  let weight = document.getElementById('weight').value;

  if (!file || !name || !weight) {
    alert("Заповни все!");
    return;
  }

  let code = manualCode ? manualCode : generateCode();

  if (usedCodes.has(code)) {
    alert("Код вже є!");
    return;
  }

  let reader = new FileReader();
  reader.onload = function(e) {

    let cell = Math.floor(Math.random() * 9) + 1;

    parcels.push({
      code,
      name,
      weight,
      img: e.target.result,
      cell
    });

    usedCodes.add(code);

    showPopup(cell);
    render();
  };

  reader.readAsDataURL(file);
}

function render(list = parcels) {
  let el = document.getElementById('list');
  el.innerHTML = "";

  list.forEach(p => {
    el.innerHTML += `
    <div class="card">
      <img src="${p.img}">
      <b>${p.name}</b>
      <p>Код: ${p.code}</p>
      <p>Ячейка: ${p.cell}</p>
      <div class="row">
        <button class="green" onclick="remove('${p.code}')">Видача</button>
        <button class="red" onclick="remove('${p.code}')">Повернення</button>
      </div>
    </div>`;
  });
}

function remove(code) {
  parcels = parcels.filter(p => p.code != code);
  usedCodes.delete(code);
  render();
}

function search(val) {
  render(parcels.filter(p => p.code.toString().includes(val)));
}

function showPopup(cell) {
  document.getElementById('cellText').innerText = "Ячейка: " + cell;
  document.getElementById('popup').classList.remove('hidden');
}

function closePopup() {
  document.getElementById('popup').classList.add('hidden');
}
</script>

</body>
</html>
